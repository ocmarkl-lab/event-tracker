<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pava Event Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#12222A; --muted:#5A6B73; --line:#D9E2E5;
  --accent:#0B6F7E; --accent-soft:#DCEFF1;
  --ok:#2E7A4C; --warn:#A8690F; --warn-soft:#FBEFD9; --bad:#A63A3A; --idle:#7A868C;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1719; --surface:#152226; --ink:#E4EEF0; --muted:#93A6AD; --line:#26383D;
  --accent:#4FC3D2; --accent-soft:#16363B;
  --ok:#6CCB92; --warn:#E3AA52; --warn-soft:#3A2C14; --bad:#EC8A8A; --idle:#8E9CA2;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 90px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.who{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
h1{font-size:26px;line-height:1.2;margin:8px 0 0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);margin-top:8px}
.facts b{color:var(--ink);font-weight:600}
.alert{margin-top:14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 14px}
.alert strong{color:var(--warn)}
.banner{margin-top:10px;font-size:12px;color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .n{font:600 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.agenda{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
h2{font-size:15px;margin:0 0 6px;font-weight:600}
.agenda ul{margin:0;padding-left:18px}.muted{color:var(--muted)}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px;margin-top:8px;border-bottom:1px solid var(--line)}
.chip{font:500 12px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
input,select,textarea{font:13px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#q{min-width:0;flex:1 1 180px}
.btn{font:600 13px var(--sans);background:var(--accent);color:var(--surface);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.section{margin-top:22px}.section p.sub{margin:0 0 10px;color:var(--muted);max-width:75ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:1080px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.co{min-width:170px}td.co b{display:block;font-weight:600}td.co span{font-size:12px;color:var(--muted)}
.stand{font:500 12px var(--mono);min-width:90px;max-width:120px}
td.why{min-width:320px;max-width:440px}
.flag{color:var(--warn);font-weight:600}
td.st{border-left:3px solid var(--idle);min-width:130px}
td.st small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
tr[data-s="Attempted"] td.st{border-left-color:var(--warn)}
tr[data-s="Confirmed"] td.st,tr[data-s="Met"] td.st{border-left-color:var(--ok)}
tr[data-s="Declined"] td.st,tr[data-s="Skip"] td.st{border-left-color:var(--bad)}
tr[data-s="Skip"] td:not(.st){opacity:.5}
tr.flash td{background:var(--accent-soft)}
td select{width:118px}
td input{width:100%;min-width:170px}td input.slot{min-width:100px;width:110px}
.hide{display:none}
footer{margin-top:28px;color:var(--muted);font-size:12px;max-width:80ch}
/* chat */
#chatBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:10px 16px;border-radius:999px}
#chat{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:30;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#chat header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:8px 11px;border-radius:8px;white-space:pre-wrap;max-width:92%;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--surface)}
.msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg .copy{display:block;margin-top:6px;font-size:11px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.hints{display:flex;flex-wrap:wrap;gap:6px}
#chatForm{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#chatIn{flex:1;resize:none;min-height:40px;max-height:140px}
@media (max-width:560px){h1{font-size:22px}}
</style></head>
<body>
<div class="wrap">
  <div class="top">
    <span class="eyebrow">Pava Partners · event tracker</span>
    <span class="who">Editing as <input id="me" placeholder="Your name" size="12" aria-label="Your name"> <a href="/logout" class="muted">Sign out</a></span>
  </div>
  <div id="picker" class="hints" style="margin-top:10px"></div>
  <div id="head"></div>
  <div class="kpis" id="kpis"></div>
  <div class="agenda"><h2>Confirmed slots</h2><div id="agenda"></div></div>
  <div class="toolbar">
    <span id="chips" class="hints"></span>
    <input type="search" id="q" placeholder="Search company, sector, country, notes">
    <span class="muted" id="msg" aria-live="polite"></span>
  </div>
  <div id="sections"></div>
  <footer id="foot"></footer>
</div>

<button id="chatBtn" class="btn" hidden>Ask the tracker</button>
<aside id="chat" hidden aria-label="Chat">
  <header><b>Ask the tracker</b><button class="btn ghost" id="chatClose">Close</button></header>
  <div id="log">
    <div class="msg assistant">Ask about targets, plan a floor route, draft outreach, or tell me to update the tracker (e.g. “Albis confirmed Wed 11:00”).</div>
    <div class="hints">
      <button class="chip hint">Plan a Wednesday route through all Tier-1 stands</button>
      <button class="chip hint">Draft a LinkedIn note to Lumiphase</button>
      <button class="chip hint">Which acquirers fit Albis?</button>
    </div>
  </div>
  <form id="chatForm"><textarea id="chatIn" rows="1" placeholder="Message" aria-label="Message"></textarea><button class="btn" id="chatSend">Send</button></form>
</aside>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/⚠/g,'<span class="flag" title="unverified">⚠</span>');
let slug = (location.pathname.match(/^\/e\/([a-z0-9-]+)/)||[])[1] || null;
let ev = null, version = 0, statuses = [], filter = 'all', chatLog = [];
const store = { get(k){try{return localStorage.getItem(k)}catch(_){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(_){}} };
$('#me').value = store.get('et_name') || '';
$('#me').addEventListener('change', e => store.set('et_name', e.target.value.trim()));
const me = () => $('#me').value.trim() || 'anonymous';
const say = t => { $('#msg').textContent = t; };

async function api(p, opt){
  const r = await fetch(p, {headers:{'Content-Type':'application/json'}, ...opt});
  if (r.status === 401) { location.href = '/'; throw new Error('login'); }
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

function when(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString(undefined,{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }

function renderHead(persist){
  $('#head').innerHTML = `<h1>${esc(ev.name)} — ${esc(ev.city)}</h1>
   <div class="facts"><span>Venue <b>${esc(ev.venue)}</b></span><span>Conference <b>${esc(ev.conference)}</b></span><span>Exhibition <b>${esc(ev.exhibition)}</b></span><span>${esc(ev.screened||'')}</span><span>Last change <b>${esc(when(ev.updatedAt))}</b></span></div>
   ${ev.alert?`<div class="alert"><strong>Timing.</strong> ${esc(ev.alert)}</div>`:''}
   ${persist?'':'<div class="banner">Storage is not connected — changes are lost on restart.</div>'}`;
  $('#chips').innerHTML = [['all','All']].concat(Object.entries(ev.tiers).map(([k,v])=>[k,v.name.split(' — ')[0]]))
    .map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${esc(l)}</button>`).join('');
  $('#foot').textContent = (ev.footer||'') + ' Changes save automatically and are visible to everyone with access.';
  document.title = ev.name + ' — Pava Event Tracker';
}
function renderKpis(){
  const c = {}; statuses.forEach(s=>c[s]=0); ev.rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);
  $('#kpis').innerHTML = ['To approach','Attempted','Confirmed','Met','Declined'].map(s=>`<div class="kpi"><div class="n">${c[s]||0}</div><div class="l">${s}</div></div>`).join('');
  const items = ev.rows.filter(r=>(r.status==='Confirmed'||r.status==='Met')&&r.slot).sort((a,b)=>a.slot.localeCompare(b.slot));
  $('#agenda').innerHTML = items.length ? '<ul>'+items.map(r=>`<li><span class="stand">${esc(r.slot)}</span> — <b>${esc(r.company)}</b> · stand ${esc(r.stand)}${r.updatedBy?` <span class="muted">(${esc(r.updatedBy)})</span>`:''}</li>`).join('')+'</ul>'
    : '<p class="muted" style="margin:0">No confirmed slots yet. Set a status to Confirmed and add a slot like “Wed 11:00”.</p>';
}
function rowHtml(r){
  const opts = statuses.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('');
  const hay = [r.company,r.country,r.stand,r.sector,r.why,r.contact,r.notes].join(' ').toLowerCase();
  return `<tr data-id="${esc(r.id)}" data-s="${esc(r.status)}" data-hay="${esc(hay)}">
    <td class="st"><select id="s-${esc(r.id)}" data-f="status" aria-label="Status ${esc(r.company)}">${opts}</select>${r.updatedBy?`<small>${esc(r.updatedBy)} · ${esc(when(r.updatedAt))}</small>`:''}</td>
    <td class="co"><b>${esc(r.company)}</b><span>${esc(r.country)} · ${esc(r.sector)}</span></td>
    <td class="stand">${esc(r.stand)}</td>
    <td class="why">${fmt(r.why)}</td>
    <td><input id="c-${esc(r.id)}" data-f="contact" value="${esc(r.contact)}" aria-label="Contact ${esc(r.company)}"></td>
    <td><input class="slot" id="t-${esc(r.id)}" data-f="slot" value="${esc(r.slot)}" placeholder="Day time" aria-label="Slot ${esc(r.company)}"></td>
    <td><input id="n-${esc(r.id)}" data-f="notes" value="${esc(r.notes)}" placeholder="Notes / next step" aria-label="Notes ${esc(r.company)}"></td>
  </tr>`;
}
function renderRows(){
  $('#sections').innerHTML = Object.entries(ev.tiers).map(([k,t])=>{
    const rows = ev.rows.filter(r=>r.tier===k);
    return `<section class="section" data-tier="${k}"><h2>${esc(t.name)} <span class="muted">(${rows.length})</span></h2><p class="sub">${esc(t.sub)}</p>
      <div class="tbl"><table><thead><tr><th>Status</th><th>Company</th><th>Stand</th><th>Why meet</th><th>Contact</th><th>Slot</th><th>Notes</th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table></div></section>`;
  }).join('');
  applyFilter();
}
function applyFilter(){
  const q = $('#q').value.trim().toLowerCase();
  document.querySelectorAll('section[data-tier]').forEach(sec=>{
    sec.hidden = !(filter==='all'||sec.dataset.tier===filter);
    sec.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('hide', !!q && !tr.dataset.hay.includes(q)));
  });
}
function renderAll(persist){ renderHead(persist); renderKpis(); renderRows(); }

async function loadEvent(){
  const j = await api('/api/events/'+slug);
  ev = j.event; version = j.version; statuses = j.statuses;
  renderAll(j.persist);
  $('#chatBtn').hidden = !j.chat || !$('#chat').hidden;
}
async function boot(){
  const list = await api('/api/events');
  if (list.events.length > 1) $('#picker').innerHTML = list.events.map(e=>`<a class="chip" aria-pressed="${e.slug===slug}" href="/e/${e.slug}">${esc(e.name)} · ${esc(e.city)}</a>`).join('');
  if (!slug) { if (!list.events.length) { $('#head').innerHTML='<h1>No events yet</h1>'; return; } slug = list.events[0].slug; history.replaceState(null,'','/e/'+slug); }
  await loadEvent();
  setInterval(poll, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); });
}
async function poll(){
  if (document.hidden) return;
  const a = document.activeElement;
  if (a && a.closest && a.closest('tbody') && (a.tagName==='INPUT')) return; // don't clobber typing
  try {
    const j = await api('/api/events/'+slug);
    if (j.version !== version) { ev = j.event; version = j.version; const y = scrollY; renderAll(j.persist); scrollTo(0,y); }
  } catch(_){}
}

async function save(tr, field, value){
  const id = tr.dataset.id, r = ev.rows.find(x=>x.id===id);
  if (!store.get('et_name') && !$('#me').value.trim()) { $('#me').focus(); say('Add your name first so the team sees who changed what.'); }
  say('Saving…');
  try {
    const j = await api(`/api/events/${slug}/rows/${id}`, {method:'POST', body: JSON.stringify({[field]: value, by: me()})});
    Object.assign(r, j.row); version = j.version;
    tr.dataset.s = r.status; renderKpis(); say('Saved');
    const sm = tr.querySelector('td.st small') || tr.querySelector('td.st').appendChild(document.createElement('small'));
    sm.textContent = `${r.updatedBy} · ${when(r.updatedAt)}`;
  } catch(e){ say('Not saved: '+e.message); }
}
document.addEventListener('change', e=>{
  const tr = e.target.closest('tr[data-id]'); if (!tr || !e.target.dataset.f) return;
  save(tr, e.target.dataset.f, e.target.value);
});
document.addEventListener('click', e=>{
  const c = e.target.closest('button.chip[data-f]');
  if (c) { filter = c.dataset.f; document.querySelectorAll('button.chip[data-f]').forEach(x=>x.setAttribute('aria-pressed', x===c)); applyFilter(); }
  const h = e.target.closest('.hint'); if (h) { $('#chatIn').value = h.textContent; sendChat(); }
  const cp = e.target.closest('.copy'); if (cp) { navigator.clipboard?.writeText(cp.dataset.t).then(()=>{cp.textContent='Copied';}); }
});
$('#q').addEventListener('input', applyFilter);

// chat
$('#chatBtn').onclick = ()=>{ $('#chat').hidden=false; $('#chatBtn').hidden=true; $('#chatIn').focus(); };
$('#chatClose').onclick = ()=>{ $('#chat').hidden=true; $('#chatBtn').hidden=false; };
function addMsg(role, text){
  const d = document.createElement('div'); d.className = 'msg '+role; d.textContent = text;
  if (role==='assistant' && text.length>60){ const b=document.createElement('button'); b.className='copy'; b.type='button'; b.textContent='Copy'; b.dataset.t=text; d.appendChild(b); }
  $('#log').appendChild(d); $('#log').scrollTop = $('#log').scrollHeight; return d;
}
async function sendChat(){
  const t = $('#chatIn').value.trim(); if (!t) return;
  $('#chatIn').value=''; addMsg('user', t); chatLog.push({role:'user', content:t});
  const wait = addMsg('assistant','Thinking…'); $('#chatSend').disabled = true;
  try {
    const j = await api(`/api/events/${slug}/chat`, {method:'POST', body: JSON.stringify({messages: chatLog, by: me()})});
    wait.remove(); addMsg('assistant', j.text || '(no answer)'); chatLog.push({role:'assistant', content:j.text||''});
    if (j.changed && j.changed.length) { await loadEvent(); j.changed.forEach(id=>document.querySelector(`tr[data-id="${id}"]`)?.classList.add('flash')); }
  } catch(e){ wait.textContent = 'Chat failed: '+e.message; chatLog.pop(); }
  $('#chatSend').disabled = false;
}
$('#chatForm').addEventListener('submit', e=>{ e.preventDefault(); sendChat(); });
$('#chatIn').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }});

boot().catch(e=>{ $('#head').innerHTML = '<h1>Could not load</h1><p class="muted">'+esc(e.message)+'</p>'; });
})();
</script>
</body></html>
